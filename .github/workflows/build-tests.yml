name: Build Tests

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@feat/test-dep-hooks
    secrets: inherit
    with:
      gh_automations_ref: 'feat/test-dep-hooks'
      python_versions: '["3.12"]'
      install_extras: 'test'
      test_path: 'test_skip_canary'
