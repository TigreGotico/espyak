[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "espyak"
dynamic = ["version"]
description = "Pure-Python, dependency-free reimplementation of espeak-ng's grapheme-to-phoneme (G2P) engine"
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
]
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "JarbasAi", email = "jarbasai@mailfence.com" }]
keywords = ["g2p", "phonemizer", "espeak", "espeak-ng", "ipa", "tts", "grapheme-to-phoneme"]
dependencies = ["scriptconv>=0.0.2"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
espyak = "espyak.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "espyak.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["espyak*"]

[tool.setuptools.package-data]
espyak = ["data/**/*"]
